services:
  # Spring Boot Backend Service
  - type: web
    name: toolverse-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        value: ${MONGODB_URI}
      - key: SPRING_DATA_MONGODB_DATABASE
        value: ${MONGODB_DATABASE}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SERVER_PORT
        value: 8080
    healthCheck:
      path: /api/actuator/health
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
